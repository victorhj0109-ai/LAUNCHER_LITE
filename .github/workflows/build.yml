name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Extrair e ajustar
        run: |
          unzip -q LauncherLite.zip
          sed -i "s/COLOQUE_SUA_CHAVE_TMDB/${{ secrets.TMDB_KEY }}/" LauncherLite/app/src/main/java/br/launcher/lite/MainActivity.kt
      - name: Compilar
        working-directory: LauncherLite
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherLite-apk
          path: LauncherLite/app/build/outputs/apk/release/*.apk
